# Publishes the apps to GitHub Pages whenever `main` changes.
# Nothing here needs to be run by hand: push to main and the live site updates.
#
# Two apps are published from one site:
#   v1  ->  /flash-cards-app/      (frozen, in daily use)
#   v2  ->  /flash-cards-app/v2/   (under construction)
#
# If either build fails the whole workflow fails and nothing is published, so
# the currently live site stays exactly as it is. That is the desired
# behaviour: a broken v2 must never be able to take v1 down.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual re-run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# If two deploys overlap, let the newer one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v2/package-lock.json

      # v1, into dist/
      - run: npm ci
      - run: npm run build

      # v2, into dist/v2/
      - run: npm ci
        working-directory: v2
      - run: npm run build
        working-directory: v2
      - run: mv v2/dist dist/v2

      # Cheap guard against publishing a site that is missing an app.
      - name: Check both apps are present
        run: |
          test -f dist/index.html || { echo "v1 is missing from the build"; exit 1; }
          test -f dist/v2/index.html || { echo "v2 is missing from the build"; exit 1; }
          echo "v1 and v2 both built"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
